</head>

<body>

        <nav class="navbar navbar-expand-md navbar-dark bg-dark bg-gradient">
            <div class="container-fluid">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse"
                    aria-controls="navbarCollapse" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarCollapse">
                    <ul class="navbar-nav me-auto mb-md-0">
                        <li class="nav-item">

                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="sobre.html">Sobre</a>

                        <li class="nav-item">

                        </li>
                    </ul>
                </div>
                <a class="navbar-brand justify-content-end" href="index.html">
                    <img src="./image/galaxia.png" width="30" height="30">
                </a>
            </div>
        </nav>
    </header>
    <main class="container mt-5 pt-3">
        <section class="row">
            <form class="col-12 p-4 text-white rounded bg-dark">
                <h1 class="text-center">Entre em Contato</h1>
                <div class="mt-4 p-4 rounded text-black bg-light">
                    <div class="mb-3">
                        <label for="nome" class="form-label">Nome Completo</label>
                        <input type="text" class="form-control" id="nome" placeholder="Ex: Guilherme Leme Machado"
                            required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" placeholder="Ex: guilherme@email.com"
                            required>
                    </div>
                    <div class="mb-3">
                        <label for="assunto" class="form-label">Assunto</label>
                        <select class="form-select" id="assunto">
                            <option selected value="1">Dúvida Astronômica/Científica</option>
                            <option value="2">Sugestão de Conteúdo para o Site</option>
                            <option value="3">Reportar Erro ou Correção</option>
                            <option value="4">Parcerias ou Projetos Acadêmicos</option>
                            <option value="5">Outro Assunto</option>
                        </select>
                    </div>
                    <div class="col-sm-3 mb-3">
                        <h6>Nível de Conhecimento em Astronomia</h6>
                        <div class="form-check mt-2">
                            <input type="radio" class="form-check-input" name="conhecimento" id="radio_1" checked>
                            <label for="radio_1" class="form-check-label">
                                Iniciante / Curioso
                            </label>
                        </div>
                        <div class="form-check">
                            <input type="radio" class="form-check-input" name="conhecimento" id="radio_2">
                            <label for="radio_2" class="form-check-label">
                                Amador / Entusiasta
                            </label>
                        </div>
                        <div class="form-check">
                            <input type="radio" class="form-check-input" name="conhecimento" id="radio_3">
                            <label for="radio_3" class="form-check-label">
                                Estudante / Profissional
                            </label>
                        </div>
                    </div>
                    <div class="col-sm-4 mb-3">
                        <h6>Áreas de Maior Interesse</h6>
                        <div class="form-check mt-2">
                            <input type="checkbox" class="form-check-input" id="checkbox_1" checked>
                            <label for="checkbox_1" class="form-check-label">
                                Sistema Solar
                            </label>
                        </div>
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="checkbox_2">
                            <label for="checkbox_2" class="form-check-label">
                                Exoplanetas e Vida Extraterrestre
                            </label>
                        </div>
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="checkbox_3">
                            <label for="checkbox_3" class="form-check-label">
                                Telescópios e Tecnologia Espacial
                            </label>
                        </div>
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="checkbox_4">
                            <label for="checkbox_4" class="form-check-label">
                                Buracos Negros e Cosmologia
                            </label>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="mensagem" class="form-label">Mensagem</label>
                        <textarea class="form-control" id="mensagem" rows="6" required></textarea>
                    </div>
                    <div class="col-sm-12 text-end">
                        <button class="btn btn-dark" type="submit">Enviar</button>
                    </div>
                </div>
            </form>
        </section>
    </main>
    <footer>
        <div class="p-5 mt-4 bg-light">
            <div class="row">
                <div class="col-sm-10">
                    <a href="index.html" class="col-1 text-decoration-none">

                    </a>

                </div>

                    <h5>Navegação</h5>

                        <li class="col-sm-1 nav-item mb-2">

                        </li>
                        <li class="col-sm-1 nav-item mb-2">
                            <a href="dados.html" class="nav-link p-0 text-body-secondary">Dados</a>
                        </li>
                        <li class="col-sm-1 nav-item mb-2">

                        </li>

                        </li>
                        <li class="col-sm-1 nav-item mb-2">
                            <a href="contato.html" class="nav-link p-0 text-body-secondary">Contato</a>

                    </ul>
